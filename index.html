<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trenchess Remastered</title>
    <meta name="description" content="Chess on a battlefield: terrain, jousting kings and backflipping pawns." />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trenchess" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <!--
      Critical boot styles: inline so nothing unstyled can flash before the game's CSS arrives.
      The cover is the studio card the splash scene draws (SplashScene.ts), laid out with the same
      offsets, the same scale factor k = clamp(viewport height / 900, 0.6, 1) and the same scanline
      and vignette recipes (ui/art/effects.ts), so the scene takes over in place.
    -->
    <style>
      :root { --k: 1; }
      html, body { margin: 0; height: 100%; background: #000; color: #e9e2cf; overflow: hidden; }
      .hidden, .booting #hud, .booting #panels, .booting #over, .booting #banner { display: none !important; }
      #boot { position: fixed; inset: 0; z-index: 1000; background: #000; color: #f2c94c; font-family: Cinzel, Georgia, serif; transition: opacity 0.45s ease; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot::before { content: ""; position: absolute; inset: 0; opacity: 0.55; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 2px, rgba(255, 255, 255, 0.025) 2px 3px, transparent 3px 4px); }
      #boot::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 72% 72% at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 80%, rgba(0, 0, 0, 0.92) 100%); }
      #boot > * { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center; }
      #boot .boot-mark { top: calc(50% - 165px * var(--k)); width: calc(190px * var(--k)); height: calc(190px * var(--k)); filter: drop-shadow(0 0 calc(28px * var(--k)) rgba(242, 201, 76, 0.45)); animation: boot-float 3.6s ease-in-out infinite; }
      #boot .boot-presented { top: calc(50% + 60px * var(--k)); font-size: calc(15px * var(--k)); font-weight: 600; letter-spacing: 6px; opacity: 0.85; }
      #boot .boot-studio { top: calc(50% + 92px * var(--k)); font-size: calc(44px * var(--k)); font-weight: 800; text-shadow: 0 0 22px rgba(242, 201, 76, 0.85); }
      #boot .boot-progress { top: calc(50% + 196px * var(--k)); display: grid; justify-items: center; gap: 10px; }
      #boot .boot-bar { width: 200px; height: 2px; background: rgba(242, 201, 76, 0.18); overflow: hidden; border-radius: 2px; }
      #boot .boot-bar i { display: block; width: 8%; height: 100%; background: #f2c94c; transition: width 0.3s ease; }
      #boot .boot-status { font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #9aa3b5; min-height: 1.2em; }
      @keyframes boot-float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-mark { animation: none; } }
    </style>
  </head>
  <body class="booting">
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Trenchess">
      <img class="boot-mark" src="/src/assets/brand/hall-of-the-gods.webp" alt="" />
      <div class="boot-presented">PRESENTED BY</div>
      <div class="boot-studio">Hall of the Gods, Inc.</div>
      <div class="boot-progress"><div class="boot-bar"><i></i></div><small class="boot-status">Loading</small></div>
    </div>
    <script>
      (function () {
        var fit = function () { document.documentElement.style.setProperty("--k", String(Math.min(1, Math.max(0.6, window.innerHeight / 900)))); };
        fit();
        window.addEventListener("resize", fit);
        var bar = document.querySelector("#boot .boot-bar i");
        var status = document.querySelector("#boot .boot-status");
        var at = 0.08;
        // Called from main.ts as the boot advances; only ever moves forward.
        window.__boot = {
          step: function (fraction, label) {
            if (fraction < at) return;
            at = fraction;
            if (bar) bar.style.width = Math.round(fraction * 100) + "%";
            if (status) status.textContent = label;
          },
        };
      })();
    </script>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="stage"></div>

    <section id="panels" class="screen panels hidden">
      <section class="panel steel hidden" data-panel="educate">
        <header class="panel-head"><button class="btn panel-close" data-back>‹ Back</button><h2>Educate Trenchess</h2></header>
        <div class="panel-body chessmen"></div>
      </section>
    </section>

    <section id="hud" class="hidden">
      <header class="topbar">
        <div class="plate steel p0"><img class="crest" alt="" /><div><b class="fname"></b><small class="count"></small></div><div class="trophies"></div></div>
        <div class="turnplate steel"><div class="turn-line"></div><div class="pips"></div><div class="thinking hidden">Enemy commander is planning…</div></div>
        <div class="plate steel p1"><div class="trophies"></div><div><b class="fname"></b><small class="count"></small></div><img class="crest" alt="" /></div>
      </header>

      <aside class="inspector">
        <div class="unit-card steel hidden"><img class="portrait" alt="" /><div><h3 class="u-name"></h3><small class="u-role"></small><p class="u-moves"></p></div><div class="u-preview"></div></div>
        <div class="terrain-card steel"><div><h4 class="t-name">Plains</h4><p class="t-text"></p></div><img class="t-strip" alt="" /></div>
      </aside>

      <aside class="log steel"><h4>Battle log</h4><ol></ol></aside>

      <div class="deploy steel hidden">
        <h3 class="deploy-title">Deployment</h3>
        <p class="deploy-hint"></p>
        <div class="tools"></div>
        <div class="row"><button class="btn" data-act="randomize">Randomize</button><button class="btn" data-act="clear">Clear</button></div>
        <button class="btn primary" data-act="ready">Ready for battle</button>
      </div>

      <div class="actions steel">
        <button class="btn primary" data-act="end-turn">End turn <kbd>Space</kbd></button>
        <button class="btn icon" data-act="rotate-left" title="Rotate view left (Q)">⟲</button>
        <button class="btn icon" data-act="rotate-right" title="Rotate view right (E)">⟳</button>
        <button class="btn icon" data-act="style" title="Change piece style (T)">♞</button>
        <button class="btn icon" data-act="sound" title="Sound">🔊</button>
        <button class="btn icon" data-act="menu" title="Menu">☰</button>
      </div>
    </section>

    <div id="banner" class="hidden"><h2></h2><p></p></div>

    <section id="over" class="screen hidden">
      <div class="over-card steel">
        <h2 class="over-title"></h2>
        <p class="over-text"></p>
        <div class="row"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="to-menu">Main menu</button></div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
